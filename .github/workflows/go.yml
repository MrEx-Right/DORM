name: DORM Builder

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26.0' # go.mod dosyanla aynı yapmayı unutma
        cache: true # Bağımlılıkları cache'ler, her seferinde baştan indirip kanser etmez

    - name: Install Dependencies
      run: go mod download

    - name: Run Linter (GolangCI)
      uses: golangci/golangci-lint-action@v6
      with:
        version: latest
        args: --timeout=5m # Büyük projelerde linter patlamasın diye timeout koyduk

    - name: Build
      run: go build -v ./...

    - name: Test
      run: go test -v -race -cover ./... # Race condition ve test coverage da olsun bir zahmet
