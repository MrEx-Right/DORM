name: Tests (Windows)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: go.mod
        cache: true 

    - name: Install Dependencies
      run: go mod download

    - name: Run Linter (GolangCI)
      uses: golangci/golangci-lint-action@v9
      with:
        version: v2.15.0
        args: --timeout=5m

    - name: Build
      run: go build -v ./...

    - name: Test
      run: go test -v -race -cover ./... 
