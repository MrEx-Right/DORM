name: Tests (Ubuntu)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26.0' 
        cache: true 

    - name: Install Dependencies
      run: go mod download

    - name: Run Linter (GolangCI)
      uses: golangci/golangci-lint-action@v7
      with:
        version: v2.13.2 
        args: --timeout=5m

    - name: Build
      run: go build -v ./...

    - name: Test
      run: go test -v -race -cover ./... 
